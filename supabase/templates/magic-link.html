<h2 style="font-family:Arial,sans-serif;color:#17153A">Your Study Buddy sign-in code</h2>
<p style="font-family:Arial,sans-serif;color:#4A4870">Type this code in Study Buddy:</p>
<p style="font-family:Arial,sans-serif;font-size:32px;font-weight:bold;letter-spacing:6px;color:#17153A">{{ .Token }}</p>
<p style="font-family:Arial,sans-serif;color:#4A4870">Or, on this device, tap the button to sign in straight away:</p>
<p><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#FFC93C;color:#17153A;font-family:Arial,sans-serif;font-weight:bold;padding:14px 24px;border-radius:14px;text-decoration:none">Sign in to Study Buddy</a></p>
<p style="font-family:Arial,sans-serif;font-size:13px;color:#8A88AD">The code and link work once and expire after an hour. If you didn't ask to sign in, you can ignore this email.</p>
